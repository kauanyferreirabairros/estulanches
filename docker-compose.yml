services:
  app:
    build: .
    container_name: estulanches-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-estulanches}:${POSTGRES_PASSWORD:-estulanches_dev}@db:5432/${POSTGRES_DB:-estulanches}
      JWT_SECRET: ${JWT_SECRET:-desenvolvimento-troque-esta-chave}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@estulanches.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  db:
    image: postgres:16-alpine
    container_name: estulanches-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-estulanches}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-estulanches_dev}
      POSTGRES_DB: ${POSTGRES_DB:-estulanches}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
